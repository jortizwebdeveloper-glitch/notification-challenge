x-base: &base
  build:
    context: .
    target: runtime
  image: take-home-image

x-env: &env
  DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
  SECRET_KEY_JWT: ${SECRET_KEY_JWT}

services:
  api:
    <<: *base
    environment:
      <<: *env
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  seed:
    <<: *base
    environment:
      <<: *env
    command: ["poe", "seed", "users"]
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    <<: *base
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["migrate"]
  
  test:
    build:
      context: .
      target: testdoc
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      <<: *env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["test"]

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette

    profiles: ["adminer"]

volumes:
  redis_data:
  db_data: