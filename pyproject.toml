[project]
name = "take-home-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Jortiz", email = "jortiz.webdeveloper@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "markdown>=3.11.2",
    "poethepoet>=0.49.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]


[tool.poe.env]
PYTHONPATH = "."

[tool.poe.tasks]
"mg:current" = "alembic current"

[tool.poe.tasks.seed]
cmd = "python src/scripts/${file}.py"
args = [{ name = "file", positional = true }]

[tool.poe.tasks.run]
cmd = "python ${file}"
args = [{ name = "file", positional = true }]

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["-ra", "--cov", "--cov-report=term-missing", "--cov-report=html"]


[tool.coverage.run]
source = ["src", "main"]
omit = ["tests/*", ".venv/*"]
branch = true

[tool.coverage.report]
exclude_also = ["@abstractmethod"]
